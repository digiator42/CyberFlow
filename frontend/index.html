<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GritShield SOC — Live Threat Console</title>
    <style>
        :root {
            --bg: #0a0e14;
            --surface: #11161f;
            --surface-2: #1a212d;
            --border: #232c3b;
            --text: #d7dee9;
            --text-muted: #7d8ba1;
            --accent: #3ddc97;
            --accent-dim: #1f8f66;
            --danger: #ff5d5d;
            --warn: #ffb020;
            --info: #4da3ff;
            --debug: #7d8ba1;
            --critical: #ff3d6e;
            --radius: 8px;
            --mono: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        code { font-family: var(--mono); }

        /* ---- Shell layout ---- */
        .app-shell { min-height: 100vh; display: flex; flex-direction: column; }
        .layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; padding: 16px; flex: 1; }
        .col-main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
        .col-side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
        @media (max-width: 980px) { .layout { grid-template-columns: 1fr; } }

        /* ---- Top bar ---- */
        .topbar { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--border); }
        .brand { display: flex; align-items: baseline; gap: 8px; }
        .brand-mark { color: var(--accent); font-size: 20px; }
        .brand-name { font-weight: 800; letter-spacing: 2px; font-size: 16px; }
        .brand-sub { color: var(--text-muted); font-size: 11px; letter-spacing: 3px; }
        .topbar-status { display: flex; align-items: center; gap: 16px; font-size: 12px; }
        .mode-badge { background: var(--surface-2); border: 1px solid var(--border); color: var(--accent); padding: 3px 10px; border-radius: 12px; font-weight: 700; letter-spacing: 1px; }
        .conn { display: flex; align-items: center; gap: 6px; color: var(--text-muted); }
        .conn-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); display: inline-block; }
        .conn-dot.open { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
        .conn-dot.connecting, .conn-dot.reconnecting { background: var(--warn); animation: pulse 1s infinite; }
        .conn-dot.closed { background: var(--danger); }
        @keyframes pulse { 50% { opacity: 0.35; } }
        .stream-endpoint { font-family: var(--mono); color: var(--text-muted); font-size: 11px; }

        /* ---- Metrics strip ---- */
        .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1px; background: var(--border); border-bottom: 1px solid var(--border); }
        .metric-tile { background: var(--surface); padding: 12px 20px; display: flex; flex-direction: column; gap: 2px; }
        .metric-label { font-size: 10px; letter-spacing: 2px; color: var(--text-muted); }
        .metric-value { font-size: 26px; font-weight: 700; font-family: var(--mono); color: var(--accent); }
        .metric-value.metric-danger { color: var(--danger); }
        .metric-value.metric-small { font-size: 20px; }
        .metric-sub { font-size: 11px; color: var(--text-muted); }
        .metric-spark { justify-content: center; }
        .sparkline { width: 100%; height: 36px; }
        .sparkline-line { stroke: var(--accent); stroke-width: 1.5; }

        /* ---- Controls ---- */
        .controls { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--border); }
        .controls-group { display: flex; align-items: center; gap: 8px; }
        .mode-btn { background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border); padding: 6px 14px; border-radius: var(--radius); font-size: 12px; font-weight: 600; cursor: pointer; }
        .mode-btn.active { background: var(--accent); color: #06130d; border-color: var(--accent); }
        .chip { background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border); padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; cursor: pointer; letter-spacing: 0.5px; }
        .chip.active { color: #06130d; background: var(--accent); border-color: var(--accent); }
        .chip.chip-debug.active { background: var(--debug); }
        .chip.chip-info.active { background: var(--info); }
        .chip.chip-warn.active { background: var(--warn); }
        .chip.chip-error.active { background: var(--danger); color: #fff; }
        .chip.chip-critical.active { background: var(--critical); color: #fff; }
        .controls-search { flex: 1; min-width: 220px; }
        .filter-input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 7px 12px; border-radius: var(--radius); font-family: var(--mono); font-size: 12px; }
        .filter-input:focus { outline: none; border-color: var(--accent-dim); }
        .filter-count { font-size: 11px; color: var(--text-muted); font-family: var(--mono); white-space: nowrap; }
        .auto-scroll { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); cursor: pointer; }
        .auto-scroll input { accent-color: var(--accent); }
        .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 5px 12px; border-radius: var(--radius); font-size: 12px; cursor: pointer; }
        .btn-ghost:hover { border-color: var(--danger); color: var(--danger); }

        /* ---- Panels ---- */
        .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
        .panel-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--border); }
        .panel-title { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); }
        .panel-meta { font-size: 11px; color: var(--text-muted); font-family: var(--mono); }

        /* ---- Drop zone / analysis ---- */
        .dropzone { margin: 16px; border: 2px dashed var(--border); border-radius: var(--radius); min-height: 150px; display: flex; align-items: center; justify-content: center; transition: border-color 0.15s, background 0.15s; }
        .dropzone.drag-over { border-color: var(--accent); background: rgba(61, 220, 151, 0.06); }
        .drop-hint { text-align: center; padding: 24px 16px; }
        .drop-icon { font-size: 30px; color: var(--accent); }
        .drop-title { font-weight: 600; margin-top: 4px; }
        .drop-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
        .browse-label { display: inline-block; margin-top: 12px; font-size: 12px; color: var(--accent); cursor: pointer; text-decoration: underline; }
        .file-input { display: none; }
        .analysis { padding: 24px; width: 100%; }
        .analysis-file { font-family: var(--mono); font-size: 13px; margin-bottom: 10px; }
        .progress-track { height: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent-dim), var(--accent)); transition: width 0.2s; }
        .analysis-meta { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; color: var(--text-muted); font-family: var(--mono); }
        .analysis-pct { color: var(--accent); font-weight: 700; }
        .stream-status { display: flex; align-items: center; gap: 10px; padding: 16px; flex-wrap: wrap; }
        .stream-status .endpoint { font-size: 11px; color: var(--text-muted); background: var(--bg); padding: 2px 8px; border-radius: 4px; border: 1px solid var(--border); }
        .stream-hint { flex-basis: 100%; margin: 4px 0 0; font-size: 12px; color: var(--text-muted); }

        /* ---- Log terminal ---- */
        .term-body { height: 420px; overflow-y: auto; font-family: var(--mono); font-size: 12px; padding: 6px 0; background: #0c1118; }
        .term-body::-webkit-scrollbar { width: 10px; }
        .term-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
        .term-empty { padding: 40px 16px; text-align: center; color: var(--text-muted); font-size: 12px; }
        .log-row { display: grid; grid-template-columns: 92px 74px 260px minmax(0, 1fr); gap: 10px; padding: 3px 16px; white-space: nowrap; }
        .log-row:hover { background: var(--surface-2); }
        .log-time { color: var(--text-muted); }
        .log-level { font-weight: 700; font-size: 10px; padding: 1px 6px; border-radius: 3px; text-align: center; align-self: center; }
        .lvl-debug { color: var(--debug); background: rgba(125, 139, 161, 0.12); }
        .lvl-info { color: var(--info); background: rgba(77, 163, 255, 0.12); }
        .lvl-warn { color: var(--warn); background: rgba(255, 176, 32, 0.14); }
        .lvl-error { color: var(--danger); background: rgba(255, 93, 93, 0.14); }
        .lvl-critical { color: var(--critical); background: rgba(255, 61, 110, 0.16); animation: blink 1.2s infinite; }
        @keyframes blink { 50% { opacity: 0.55; } }
        .log-meta { color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; }
        .log-msg { color: var(--text); overflow: hidden; text-overflow: ellipsis; }

        /* ---- Threat panel ---- */
        .threat-list { max-height: 560px; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        .threat-empty { padding: 32px 12px; text-align: center; font-size: 12px; color: var(--text-muted); }
        .threat-card { border: 1px solid var(--border); border-left-width: 3px; border-radius: 6px; padding: 10px 12px; background: var(--surface-2); }
        .threat-card.sev-low { border-left-color: var(--info); }
        .threat-card.sev-medium { border-left-color: var(--warn); }
        .threat-card.sev-high { border-left-color: var(--danger); }
        .threat-card.sev-critical { border-left-color: var(--critical); box-shadow: 0 0 8px rgba(255, 61, 110, 0.25); }
        .threat-head { display: flex; justify-content: space-between; font-size: 10px; letter-spacing: 1px; }
        .threat-sev { font-weight: 800; }
        .sev-low .threat-sev { color: var(--info); }
        .sev-medium .threat-sev { color: var(--warn); }
        .sev-high .threat-sev { color: var(--danger); }
        .sev-critical .threat-sev { color: var(--critical); }
        .threat-time { color: var(--text-muted); font-family: var(--mono); }
        .threat-rule { font-weight: 600; margin-top: 4px; font-size: 13px; }
        .threat-rule-id { color: var(--text-muted); font-family: var(--mono); font-size: 11px; font-weight: 400; }
        .threat-ip { font-family: var(--mono); font-size: 11px; color: var(--text-muted); margin-top: 2px; }
        .threat-payload { display: block; margin-top: 6px; padding: 6px 8px; background: var(--bg); border-radius: 4px; font-size: 11px; color: var(--warn); overflow-wrap: anywhere; white-space: pre-wrap; }
        .threat-origin { margin-top: 6px; font-size: 10px; color: var(--text-muted); }

        /* ---- Toasts ---- */
        .toasts { position: fixed; top: 16px; right: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 50; width: 320px; }
        .toast { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; padding: 10px 12px; background: var(--surface-2); border: 1px solid var(--border); border-left-width: 4px; border-radius: var(--radius); box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45); animation: slide-in 0.18s ease-out; }
        @keyframes slide-in { from { transform: translateX(24px); opacity: 0; } }
        .toast.sev-low { border-left-color: var(--info); }
        .toast.sev-medium { border-left-color: var(--warn); }
        .toast.sev-high { border-left-color: var(--danger); }
        .toast.sev-critical { border-left-color: var(--critical); }
        .toast-title { font-weight: 700; font-size: 13px; }
        .toast-detail { font-size: 11px; color: var(--text-muted); font-family: var(--mono); }
        .toast-close { background: none; border: none; color: var(--text-muted); font-size: 16px; cursor: pointer; padding: 0 2px; }
        .toast-close:hover { color: var(--danger); }
    </style>
    <link rel="data-trunk" href="Cargo.toml" data-type="rust"/>
    <link data-trunk rel="copy-file" href="webworker.js"/>
</head>
<body>
</body>
