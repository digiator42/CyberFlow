[package]
name = "logs-soc-frontend"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
velo = { path = "C:/Users/aimli/workspace/Velo/crates/velo" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window","Document","Element","HtmlElement","Node","Text","console",
    "DragEvent","DataTransfer","DataTransferItemList","File","FileList",
    "Blob","ReadableStream","ReadableStreamDefaultReader","EventSource","MessageEvent",
    "Worker","WorkerOptions","WorkerType","MessagePort","MessageChannel",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1"
console_error_panic_hook = "0.1.7"
gloo-timers = { version = "0.4.0", features = ["futures"] }
